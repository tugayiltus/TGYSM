# TGYSM production stack (ADR-0024). Run through tools/compose.sh, which passes --env-file deploy/.env.
name: tgysm

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  TZ: ${TZ:-Europe/Istanbul}
  ConnectionStrings__Default: Host=postgres;Database=tgysm;Username=tgysm;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
  App__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
  App__TimeZone: ${APP_TIME_ZONE:-Europe/Istanbul}
  Http__KnownProxyNetworks__0: ${TGYSM_SUBNET:-172.28.0.0/24}
  Email__Mode: ${EMAIL_MODE:-Smtp}
  Email__From: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env}
  Email__PickupFolder: /data/files/email-pickup
  Email__Smtp__Host: ${SMTP_HOST:-}
  Email__Smtp__Port: ${SMTP_PORT:-587}
  Email__Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
  Email__Smtp__UserName: ${SMTP_USERNAME:-}
  Email__Smtp__Password: ${SMTP_PASSWORD:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgysm
      POSTGRES_USER: tgysm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgysm -d tgysm"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: tgysm-api:${TGYSM_VERSION:-latest}
    command: ["migrate"]
    environment: *app-environment
    volumes:
      - files:/data/files
      - keys:/data/keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: tgysm-api:${TGYSM_VERSION:-latest}
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - files:/data/files
      - keys:/data/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: tgysm-worker:${TGYSM_VERSION:-latest}
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - files:/data/files
      - keys:/data/keys
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx/tgysm.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  files:
  keys:

networks:
  default:
    ipam:
      config:
        - subnet: ${TGYSM_SUBNET:-172.28.0.0/24}
