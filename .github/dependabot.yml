version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Pinned to ^9 until eslint-plugin-react, eslint-plugin-jsx-a11y and eslint-plugin-import support ESLint 10.
    ignore:
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
